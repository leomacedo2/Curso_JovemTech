<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Busca CEP</title>
</head>
<body>
    <div class="caixa-grande">
        <h2>Busca CEP</h2>
        <div class="box-media">
            <input id="input-cep" type="text" placeholder="Digite o CEP">
            <button onclick="buscarCep()">
                <img src="https://cdn-icons-png.flaticon.com/256/64/64673.png" alt="pesquisar">
            </button>
            <div class="box-pequena">
                <h2 id="input-uf"></h2>
                <h2 id="input-cidade"></h2>
                <h2 id="input-bairro"></h2>
                <h2 id="input-logradouro"></h2>
                <h2 id="input-regiao"></h2>
            </div>
            <script src="app.js" ></script>
        </div>


    </div>
</body>
</html>
